    Projects:
      - name: PPO Mine Block Sequencing
        summary: Deep RL agent built from scratch in PyTorch (PPO actor-critic, GAE, action masking over precedence-feasible blocks, curriculum learning) that learns NPV-maximising extraction sequences under MineLib-format precedence and per-period capacity constraints; benchmarked against greedy baselines and an LP-relaxation bound.
        highlights:
          - PyTorch
          - PPO
          - Deep Reinforcement Learning

      - name: RL Job Scheduler
        summary: Tabular Q-learning agent for parallel machine scheduling.
        highlights:
          - Q-learning
          - Reinforcement Learning

      - name: DQN CartPole
        summary: Deep Q-Network (Mnih et al., 2015) implemented from scratch in PyTorch/Gymnasium with experience replay, target network, ε-greedy exploration, Huber loss and gradient clipping; unit-tested with pytest.
        highlights:
          - PyTorch
          - DQN
          - Deep Reinforcement Learning

