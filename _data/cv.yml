    Experience:
      - company: Rio Tinto (MITACS Industrial Collaboration)
        position: Graduate Researcher — Operations Research
        location: Montréal, QC, Canada
        start_date: 2022-07
        end_date: 2025-09
        summary: Three-year industrial collaboration embedded in Rio Tinto's mine-planning operations.
        highlights:
          - Achieved a 90% reduction in mine-scheduling computation time via novel cutting planes and rolling-horizon heuristics deployed on Rio Tinto's industrial planning instances.
          - Reduced time-to-feasibility by 80% through constraint relaxation strategies, enabling faster initial solution generation for large-scale MIP models used in production planning.
          - Translated research prototypes into production-relevant algorithmic tools, bridging academic OR with live mining operations and existing data infrastructure.
          - "Formal MITACS engagement concluded Sep. 2025; continue monthly technical check-ins with the Rio Tinto team, advising on scheduling model deployment and next-stage research direction."

      - company: Polytechnique Montréal · GERAD
        position: Doctoral Researcher — Operations Research
        location: Montréal, QC, Canada
        start_date: 2021-08
        end_date: ""
        summary: Doctoral research on large-scale optimization for open-pit mine production scheduling.
        highlights:
          - Designed novel cutting planes for the Open-Pit Mine Production Scheduling Problem (OPMPSP), tightening LP relaxation bounds and reducing branch-and-bound search on 100,000+ variable instances.
          - Developed relax-and-repair and parallel warm-start hybrid heuristic frameworks in C++ (OpenMP) for scalable feasible-solution generation and improvement (second paper, major revision, Engineering Optimization).
          - "Third project (in progress): building ML models (scikit-learn, PyTorch) to predict MILP instance difficulty and guide solver strategy, trained on large-scale benchmark datasets generated via structured augmentation across real-life mine instances."
          - "Presented research at JOPT 2025/2026 (Montréal), ISMP 2024 (Montréal), and IISE Annual Conference 2024."

