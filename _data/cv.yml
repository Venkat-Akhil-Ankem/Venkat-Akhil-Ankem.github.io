        start_date: 2020-06
        end_date: 2021-01
        highlights:
          - Developed a Python flight-safety analysis tool; applied data analysis and ML (random forest, regression) to Be58/TB20 and A340-300 flight datasets to identify unsafe operational conditions.

      - company: Korea Advanced Institute of Science and Technology (KAIST)
